<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Par Streak · Golfsocial</title>
  <link rel="icon" href="/favicon.ico">
  <!-- Bro fra nyhedsbrev og delinger til Par Streak-challengen i appen (Michel 12/10-2026).
       Samme opskrift som viktor.html: mails og delte links kan ikke åbne appens
       com.golfsocialapp://-adresse direkte, så linket går hertil først.
       iOS: knappen åbner challengen direkte.
       Android: fra 1.2.69 tager appen imod værten "challenges", så samme adresse
       åbnes via et intent; uden appen (eller med en ældre version) sender Chrome
       videre til /hent.
       Challenge-id'et er det eneste i PostHog prod (sponsor_name = Simgolf). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Golfsocial">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="Par Streak · Vind 2 timer hos Simgolf">
  <meta property="og:description" content="2 pars i træk giver et lod. Tre vindere af 2 timer i simulatoren. Deltag i appen frem til 1. november.">
  <meta property="og:url" content="https://golfsocial.club/parstreak">
  <meta property="og:image" content="https://golfsocial.club/images/parstreak-share.jpg">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XEBPZS1TT2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XEBPZS1TT2', { transport_type: 'beacon' });
  </script>
  <style>
    html,body{margin:0;min-height:100%;}
    body{
      background:#f3f3f3;
      font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
      color:#000;
      display:flex;align-items:center;justify-content:center;
      text-align:center;padding:24px 16px;box-sizing:border-box;min-height:100vh;
    }
    .card{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:36px 28px 32px;box-sizing:border-box;}
    .mark{font-size:20px;font-weight:700;letter-spacing:-0.5px;margin:0 0 28px;}
    .logo{width:80px;height:80px;border-radius:20px;display:block;margin:0 auto 16px;}
    h1{font-size:24px;line-height:1.2;font-weight:500;letter-spacing:-0.5px;margin:0 0 4px;color:#1E322D;}
    .line{font-size:15px;color:#909090;margin:0 0 20px;}
    .lead{font-size:16px;line-height:1.55;color:#1E322D;margin:0 0 26px;}
    .btn{display:block;background:#1E322D;color:#fff;text-decoration:none;font-size:16px;font-weight:500;
         padding:15px 20px;border-radius:12px;margin:0 0 12px;}
    .hint{font-size:14px;line-height:1.5;color:#555;margin:0 0 18px;}
    .ghost{display:inline-block;font-size:15px;color:#18a138;text-decoration:none;padding:6px 0;}
    [hidden]{display:none !important;}
  </style>
</head>
<body>
  <div class="card">
    <p class="mark">Golfsocial.</p>
    <img class="logo" src="/images/simgolf-logo.webp" alt="Simgolf" width="80" height="80">
    <h1>Par Streak</h1>
    <p class="line">Sponsoreret af Simgolf · Til 1. november</p>
    <p class="lead">2 pars i træk giver et lod. Tre vindere af 2 timer i simulatoren hos Simgolf.</p>

    <a id="open" class="btn" href="/hent">Åbn Par Streak</a>
    <p id="hint" class="hint" hidden>Du finder challengen øverst i feedet, når appen er åben.</p>
    <a id="get" class="ghost" href="/hent">Har du ikke appen? Hent Golfsocial</a>
  </div>
  <script>
    (function () {
      // Par Streaks challenge-id i appen (challenge_id på PostHog-events, Simgolf).
      // Tom = appen åbnes på forsiden i stedet for på challengen.
      var CHALLENGE_ID = '768adcd0-7a78-4160-a405-081f53c29f56';

      var params = new URLSearchParams(location.search);
      var c = (params.get('c') || 'parstreak').replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 40);
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var platform = isAndroid ? 'android' : (isIOS ? 'ios' : 'desktop');

      var hent = '/hent?c=' + encodeURIComponent(c);
      var open = document.getElementById('open');
      var get = document.getElementById('get');
      var hint = document.getElementById('hint');
      get.href = hent;

      var path = CHALLENGE_ID ? 'challenges/' + encodeURIComponent(CHALLENGE_ID) : '';

      if (isIOS) {
        open.href = 'com.golfsocialapp://' + path;
        if (!CHALLENGE_ID) { open.textContent = 'Åbn Golfsocial'; hint.hidden = false; }
      } else if (isAndroid) {
        // Åbner challengen i appen via et intent. Uden appen, eller med en version
        // før 1.2.69 der ikke kender værten "challenges", sender Chrome videre til /hent.
        var fallback = encodeURIComponent(location.origin + hent);
        open.href = 'intent://' + path + '#Intent;scheme=com.golfsocialapp;package=com.golfsocialapp.production;' +
                    'S.browser_fallback_url=' + fallback + ';end';
        if (!CHALLENGE_ID) { open.textContent = 'Åbn Golfsocial'; hint.hidden = false; }
      } else {
        // Computer: ingen app at åbne. Vis kun vejen til telefonen.
        open.hidden = true;
        hint.textContent = 'Åbn linket på din telefon for at se challengen i appen.';
        hint.hidden = false;
      }

      gtag('event', 'challenge_bridge_view', { challenge: 'parstreak', bridge_code: c, bridge_platform: platform });
      open.addEventListener('click', function () {
        gtag('event', 'challenge_bridge_open', { challenge: 'parstreak', bridge_code: c, bridge_platform: platform, transport_type: 'beacon' });
      });
      get.addEventListener('click', function () {
        gtag('event', 'challenge_bridge_get_app', { challenge: 'parstreak', bridge_code: c, bridge_platform: platform, transport_type: 'beacon' });
      });
    })();
  </script>
</body>
</html>
