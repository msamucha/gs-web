<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Hent Golfsocial</title>
  <link rel="icon" href="/favicon.ico">
  <!-- Share preview. This is the link that gets pasted into chats and bios, so
       it needs a card even though the page itself is noindex. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Golfsocial">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="Golfsocial">
  <meta property="og:description" content="Golf er mere end en runde. Det er stillingen, drillerierne, omkampen.">
  <meta property="og:url" content="https://golfsocial.club/hent">
  <meta property="og:image" content="https://golfsocial.club/images/og-home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Golfsocial">
  <meta name="twitter:description" content="Golf er mere end en runde. Det er stillingen, drillerierne, omkampen.">
  <meta name="twitter:image" content="https://golfsocial.club/images/og-home.png">
  <!-- GA4 — same property as the rest of golfsocial.club. On this router page the
       landing must be logged BEFORE the redirect fires, so the hit is sent with
       transport:beacon and the redirect waits on the event callback (see script). -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XEBPZS1TT2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XEBPZS1TT2', { transport_type: 'beacon' });
  </script>
  <style>
    html,body{margin:0;height:100%;}
    body{
      background:#f3f1ec;
      font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
      color:#141414;
      display:flex;align-items:center;justify-content:center;
      text-align:center;padding:24px;box-sizing:border-box;
    }
    .wrap{max-width:420px;width:100%;}
    .mark{font-size:22px;font-weight:700;letter-spacing:-0.5px;margin:0 0 18px;color:#13402e;}
    h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.5px;margin:0 0 10px;}
    p{font-size:16px;line-height:1.55;color:#4a4a4a;margin:0 0 26px;}
    .badges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .badge{display:inline-block;line-height:0;text-decoration:none;}
    .badge svg{height:48px;width:auto;}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="mark">Golfsocial</p>
    <h1>Åbner Golfsocial</h1>
    <p>Du sendes videre til din app-butik. Sker der ikke noget, så vælg din platform herunder.</p>
    <div class="badges">
      <a id="ios-badge" class="badge" href="https://apps.apple.com/app/apple-store/id6743446900?pt=125766814&amp;ct=web_smartlink&amp;mt=8" aria-label="Download on the App Store">
        <svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="40" rx="7" fill="#16221F"/><g fill="#FCFBF8"><path d="M26.04 19.95c-.02-2.05.92-3.6 2.81-4.74-1.06-1.51-2.66-2.34-4.76-2.5-1.99-.16-4.17 1.16-4.97 1.16-.84 0-2.77-1.1-4.29-1.1-3.12.05-6.45 2.49-6.45 7.44 0 1.47.27 2.99.81 4.57.72 2.07 3.32 7.13 6.03 7.05 1.42-.04 2.42-1.01 4.26-1.01 1.79 0 2.71 1.01 4.29 1.01 2.73-.04 5.08-4.64 5.77-6.71-3.66-1.72-3.5-5.05-3.5-5.17zm-3.17-9.22c1.53-1.82 1.39-3.48 1.35-4.07-1.36.08-2.93.92-3.83 1.97-.98 1.11-1.56 2.49-1.44 4.04 1.47.11 2.81-.64 3.92-1.94z"/><text x="38" y="16" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="400" letter-spacing="0.2">Download on the</text><text x="38" y="30" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="-0.3">App Store</text></g></svg>
      </a>
      <a id="android-badge" class="badge" href="https://play.google.com/store/apps/details?id=com.golfsocialapp.production&amp;referrer=utm_source%3Dgolfsocial.club%26utm_medium%3Dnewsletter%26utm_campaign%3Dweb_smartlink" aria-label="Get it on Google Play">
        <svg viewBox="0 0 135 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="135" height="40" rx="7" fill="#16221F"/><g transform="translate(10,9)"><path d="M1.5 0.6 L17.8 11.5 L1.5 22.4 Z" fill="#FCFBF8"/></g><g fill="#FCFBF8"><text x="36" y="16" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="400" letter-spacing="0.4">Get it on</text><text x="36" y="30" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="-0.3">Google Play</text></g></svg>
      </a>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      function clean(v) { return (v || '').replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 40); }
      var c = clean(params.get('c')) || 'web_smartlink';
      var lc = c.toLowerCase();

      // Derive the channel from the campaign code so Google Play attribution is
      // honest (a boost shows as paid, not "newsletter"). Explicit ?m= / ?s=
      // override if ever needed. Convention: put the intent in the code, e.g.
      // ig_boost (paid), ig_post (organic social), nl_juli (email).
      var medium = clean(params.get('m'));
      if (!medium) {
        if (/(boost|paid|promo|ads?)/.test(lc)) medium = 'paid';
        else if (/(^nl|mail|email|newsletter)/.test(lc)) medium = 'email';
        else if (/(post|bio|story|reel|organic|social)/.test(lc)) medium = 'social';
        else medium = 'referral';
      }
      var source = clean(params.get('s'));
      if (!source) {
        if (/^ig|instagram/.test(lc)) source = 'instagram';
        else if (/^fb|facebook/.test(lc)) source = 'facebook';
        else if (/^tt|tiktok/.test(lc)) source = 'tiktok';
        else if (/^li|linkedin/.test(lc)) source = 'linkedin';
        else if (/^nl/.test(lc)) source = 'newsletter';
        else source = 'golfsocial.club';
      }

      var referrer = 'utm_source=' + source + '&utm_medium=' + medium + '&utm_campaign=' + c;
      var ios = 'https://apps.apple.com/app/apple-store/id6743446900?pt=125766814&ct=' + encodeURIComponent(c) + '&mt=8';
      var android = 'https://play.google.com/store/apps/details?id=com.golfsocialapp.production&referrer=' + encodeURIComponent(referrer);
      var iosEl = document.getElementById('ios-badge'); if (iosEl) iosEl.href = ios;
      var andEl = document.getElementById('android-badge'); if (andEl) andEl.href = android;
      var ua = navigator.userAgent || navigator.vendor || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var platform = isAndroid ? 'android' : (isIOS ? 'ios' : 'desktop');
      var dest = isAndroid ? android : (isIOS ? ios : null);

      // Log the landing (campaign code + platform) before bouncing to the store.
      // transport:beacon lets the hit survive the unload; we redirect from the
      // event callback so the beacon is queued first, with a timeout fallback in
      // case analytics is blocked and the callback never fires.
      var gone = false;
      function go() { if (gone || !dest) return; gone = true; location.replace(dest); }
      gtag('event', 'smartlink_landing', {
        smartlink_code: c,
        smartlink_platform: platform,
        smartlink_source: source,
        smartlink_medium: medium,
        transport_type: 'beacon',
        event_callback: go
      });
      if (dest) { setTimeout(go, 900); } // fallback: don't strand the user if GA is blocked
    })();
  </script>
</body>
</html>
